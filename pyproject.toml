# Runtime is provided by aegra-cli (installed via the Makefile, latest by default).
# Last verified against aegra-cli 0.7.2.
[project]
name = "langgraph-skills-agent"
version = "0.2.5"
description = "Demo agent for the Medium article on progressive Agent Skills in LangGraph."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.3",
    "langchain>=1.0.8",
    "langchain-openai>=1.0.3",
    "langchain-ollama>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langfuse>=3.8.0",
    "pydantic>=2.11.7",
    "structlog>=25.4.0",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: fast, isolated unit tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Matching the rule families used in pessini/langgraph-prefab-ui so the
# two-repo system has a consistent lint baseline. Ruff with no config
# enables all 700+ rules — including mutually contradictory ones — so a
# defined ruleset is the only way "clean" is an enforceable target.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line-too-long is owned by the formatter, not the linter
