# Runtime is provided by aegra-cli (installed via the Makefile, latest by default).
# Last verified against aegra-cli 0.7.2.
[project]
name = "langgraph-skills-agent"
version = "0.1.0"
description = "Demo agent for the Medium article on progressive Agent Skills in LangGraph."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.3",
    "langchain>=1.0.8",
    "langchain-openai>=1.0.3",
    "langchain-ollama>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langfuse>=3.8.0",
    "pydantic>=2.11.7",
    "structlog>=25.4.0",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["unit: fast, isolated unit tests"]
